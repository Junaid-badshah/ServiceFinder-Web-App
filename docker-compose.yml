version: '3.8'

services:
  # ============================================
  # MySQL Database
  # ============================================
  mysql:
    image: mysql:8
    container_name: servicefinder-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: servicefinder
      MYSQL_USER: junaid
      MYSQL_PASSWORD: Junaid@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - servicefinder-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7
    container_name: servicefinder-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - servicefinder-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./ServiceFinder-Backend
      dockerfile: Dockerfile
    container_name: servicefinder-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/servicefinder
      SPRING_DATASOURCE_USERNAME: junaid
      SPRING_DATASOURCE_PASSWORD: Junaid@123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    networks:
      - servicefinder-network

  # ============================================
  # React Frontend (Nginx)
  # ============================================
  frontend:
    build:
      context: ./ServiceFinder-Frontend
      dockerfile: Dockerfile
    container_name: servicefinder-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - servicefinder-network

# ============================================
# Volumes (Data Persistence)
# ============================================
volumes:
  mysql_data:
  redis_data:

# ============================================
# Network
# ============================================
networks:
  servicefinder-network:
    driver: bridge
