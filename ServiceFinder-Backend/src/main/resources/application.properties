# Server
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/servicefinder
spring.datasource.username=junaid
spring.datasource.password=Junaid@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG

# JWT
jwt.secret=mySuperSecretKeyForServiceFinderAppThatIsAtLeast256BitsLong1234567890
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000